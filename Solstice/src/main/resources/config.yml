# Solstice main configuration.
# Season start dates use the calendar defined in calendar.yml (day/month).

worlds:
  # Worlds Solstice manages. Empty list = every world.
  enabled: []
  disabled-worlds: []

seasons:
  spring:
    start-day: 4
    start-month: 3
  summer:
    start-day: 4
    start-month: 6
  autumn:
    start-day: 4
    start-month: 9
  winter:
    start-day: 4
    start-month: 12

sub-seasons:
  enabled: true

visuals:
  biome-colors:
    enabled: true
    skip-bedrock-clients: true
  particles:
    enabled: true
  cherry-blossom-spring: true

world-effects:
  snow-ice:
    enabled: true
    blocks-per-tick-per-region: 8
  flora:
    enabled: true
    # Spawn-chance multiplier per biome category (categories are defined in biomes.yml).
    # 1.0 = normal density, 0 = no flowers/berry bushes in that category, >1.0 = denser than normal.
    # "default" applies to any biome not listed here (or not categorized in biomes.yml).
    #
    # FloraManager rolls each eligible grass column independently every 10s for as long as
    # the season stays active, and only stops rolling a given column once it's occupied — it
    # never expires/thins existing flora mid-season. At 1.0 (this used to be the shipped
    # default for every category below) that compounds over a sustained season until nearly
    # every eligible block ends up flowered, which one operator found out the hard way while
    # chasing what looked like a runaway flower-spawning bug (turned out to be this, not a
    # bug — see flower-watch/ in this repo for how it was actually diagnosed).
    #
    # IMPORTANT: this setting only controls how *fast* a chunk fills up, not how full it ever
    # gets — at any density above 0, given enough sustained season time, coverage still
    # approaches every eligible column (confirmed by the same operator: after lowering density
    # from 1.0 to 0.15, saturation still eventually happened, just slower). max-per-chunk below
    # is the actual ceiling; treat this as a "how quickly does it reach that ceiling" knob.
    biome-density:
      default: 0.01
      temperate: 0.15
      hot: 0.15
      jungle: 0.15
      savanna: 0.15
      cold: 0.15
      frozen: 0.15
    # Hard cap on how many flora blocks (flowers or berry bushes, whichever the current season
    # generates) a single chunk accumulates before FloraManager stops adding more — this is
    # what actually keeps it a sparse "carpet" instead of eventually blanketing every eligible
    # block, independent of biome-density above. A chunk has 256 columns; 24 is roughly 9%
    # coverage at full saturation against this cap. Individual flowers can still be broken and
    # regrow beneath this ceiling as usual; only the chunk's total count is bounded.
    max-per-chunk: 24
  crops:
    winter-requires-roof: true
    summer-growth-multiplier: 2.0
  mob-replacements:
    summer-husks: true
    winter-strays: true
    autumn-pumpkin-chance: 0.20

claim-guard:
  # Which region-protection plugin to defer to before placing/removing blocks.
  provider: none  # none | worldguard

placeholderapi:
  register-rs-alias: false

storage:
  player-data-save-interval-seconds: 60
