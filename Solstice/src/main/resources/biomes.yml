# Client-side seasonal biome recoloring (PacketEvents chunk rewrite, PLAN.md §6). World data is
# never touched — colors are per-category, and any biome not explicitly categorized here is
# classified automatically by its registry temperature value (PLAN.md §4, the Terralith approach).
#
# Categories match temperature.yml's biome-groups so hot/cold/frozen/jungle/savanna biomes look
# consistent with how they feel. "temperate" is the fallback category (plains, forest, ocean, etc).
#
# Colors are hex RGB, applied per full season. Sub-season blending (PLAN.md §3.2) interpolates
# between a season's colors and its neighbor's at runtime — this file only needs the four full-season
# colors per category.

categories:
  temperate: [PLAINS, FOREST, FLOWER_FOREST, BIRCH_FOREST, DARK_FOREST, OCEAN, DEEP_OCEAN, RIVER,
              BEACH, SWAMP, MANGROVE_SWAMP, SUNFLOWER_PLAINS, MEADOW, CHERRY_GROVE, STONY_SHORE]
  hot: [BADLANDS, ERODED_BADLANDS, WOODED_BADLANDS, DESERT]
  jungle: [JUNGLE, SPARSE_JUNGLE, BAMBOO_JUNGLE]
  savanna: [SAVANNA, SAVANNA_PLATEAU, WINDSWEPT_SAVANNA]
  cold: [WINDSWEPT_HILLS, WINDSWEPT_GRAVELLY_HILLS, TAIGA, OLD_GROWTH_PINE_TAIGA, OLD_GROWTH_SPRUCE_TAIGA, WINDSWEPT_FOREST]
  frozen: [SNOWY_PLAINS, SNOWY_TAIGA, SNOWY_BEACH, SNOWY_SLOPES, FROZEN_PEAKS, FROZEN_OCEAN, FROZEN_RIVER, ICE_SPIKES, JAGGED_PEAKS, GROVE]

colors:
  temperate:
    SPRING: {foliage: "#7CC66F", grass: "#8FE060", sky: "#8FC8E8", water: "#5FB8E8", water-fog: "#5FB8E8", fog: "#C9E8F5"}
