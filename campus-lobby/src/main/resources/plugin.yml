name: CampusLobby
version: '${version}'
main: io.github.kenvandine.campuslobby.CampusLobbyPlugin
api-version: '1.21'
folia-supported: true
load: POSTWORLD

commands:
  campuslobby:
    description: Build or reload the NC State-themed lobby scene.
    usage: /campuslobby <build|reload>

permissions:
  campuslobby.build:
    description: Trigger (re)building the campus lobby scene.
    default: op
  campuslobby.reload:
    description: Reload CampusLobby's config
    default: op
  campuslobby.admin:
    description: Bypass the built lobby world's protection (break/place blocks, use buckets there).
    default: op
