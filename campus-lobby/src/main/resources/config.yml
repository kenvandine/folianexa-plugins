# CampusLobby configuration.
# Edit, then run "/campuslobby reload" — no restart needed. Changing
# scene values doesn't retroactively rebuild already-placed blocks; run
# "/campuslobby build" again after a reload to re-place the scene.

scene:
  # Plaza (the "Brickyard") half-width in blocks. The plaza is a square
  # centered on the build origin, (2 * plaza-radius + 1) blocks per side.
  # 48 gives a grand ~97x97 campus square (2x the original size).
  plaza-radius: 48

  # Belltower height in blocks, measured from the plaza surface.
  tower-height: 54

  # Which landmarks to place. All default on; turn any off to keep the
  # scene smaller/faster to place.
  include:
    belltower: true
    wolf-statue: true
    tunnel: true
    union-facade: true
    library-facade: true
    enclosure: true

  # Wolfpack color & colored clay palette. Values are org.bukkit.Material
  # names — styled with NC State red/white/black and rich terracotta/colored clay.
  colors:
    primary-red: RED_CONCRETE
    white: WHITE_CONCRETE
    black: BLACK_CONCRETE
    brick: RED_TERRACOTTA
    brick-trim: TERRACOTTA
    glass: WHITE_STAINED_GLASS_PANE
    roof: POLISHED_BLACKSTONE
    clay-red: RED_TERRACOTTA
    clay-white: WHITE_TERRACOTTA
    clay-black: BLACK_TERRACOTTA
    clay-gray: GRAY_TERRACOTTA
    clay-normal: TERRACOTTA

  # Clears leftover terrain (rogue trees, hills, floating debris, etc.)
  # from the build area before placing the scene. The clear always
  # starts at the plaza floor and works upward — it never digs below
  # the floor, so it can't leave a hole under the plaza.
  clear:
    # Horizontal margin (blocks) cleared beyond the generated scene's
    # own footprint.
    padding: 12
    # Vertical margin (blocks) cleared above the tallest generated
    # feature (the Belltower spire, by default).
    height-above: 18

  # Extra margin (blocks) beyond the cleared area before the world
  # border kicks in. The lobby world's border is set to hug the
  # cleared area (see clear above) plus this margin, so players can't
  # wander out of the lobby into the rest of the world — it's meant
  # purely as a jumping-off point to other worlds.
  border-margin: 10

# Labels shown on the standing signs CampusLobby places near each
# landmark. Purely cosmetic signage — CampusLobby does not handle
# clicks or teleportation itself. Pair these labels with matching
# entries in ServerSelector's own config.yml (catalog id
# "ServerSelector") if you want the signs to sit next to its actual
# selector NPCs/portals.
signs:
  belltower: "Memorial Belltower"
  wolf-statue: "Howl at the Wolfpack statue"
  tunnel: "Free Expression Tunnel"
  union-facade: "Talley Student Union"
  library-facade: "D. H. Hill Jr. Library"

